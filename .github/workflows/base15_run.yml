name: Continuous Base 15 Persistence Hunt

on:
  schedule:
    - cron: '45 */6 * * *'  # Runs 45 minutes past every 6th hour
  workflow_dispatch:

concurrency:
  group: persistence-hunter-base15
  cancel-in-progress: false

jobs:
  run-base15-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Base 15 Prime Tree Search
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python prime_tree_base15.py

      - name: Commit and Push Updated State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Automated update: Save Base 15 prime tree state" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
