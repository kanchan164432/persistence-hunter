name: Daily Persistence Hunt

# This schedules the script to run every day at 12:00 UTC
on:
  schedule:
    - cron: '0 12 * * *'
  # Allows you to trigger it manually for testing
  workflow_dispatch:

jobs:
  run-math-hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Persistence Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py
