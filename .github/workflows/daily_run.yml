name: Daily Persistence Hunt

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-math-hunt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Persistence Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit and Push State and Results to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json daily_history.json jackpots.json || true
          git commit -m "Automated update: Update state and daily persistence records" || exit 0
          git push
