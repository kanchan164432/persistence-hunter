name: Continuous Persistence Hunt

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: persistence-hunter
  cancel-in-progress: false

jobs:
  run-math-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # Safety cap: stops the job gracefully after 5.5 hours
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Persistence Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit and Push Updated State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Automated update: Save persistence state and history" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
